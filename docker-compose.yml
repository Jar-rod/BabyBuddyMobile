services:
  twin-log:
    build: .
    image: twin-log:latest
    container_name: twin-log
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8001}:8090"   # phone URL: http://<pi-ip>:8001
    env_file:
      - path: .env
        required: false
    environment:
      BABYBUDDY_URL: ${BABYBUDDY_URL:-http://192.168.0.28:8000}
